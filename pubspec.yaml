name: flutter_unused_code
description: Finds dead code in Dart and Flutter projects - unused files, declarations, public members and widgets - using a resolved reference graph.
version: 0.1.0
repository: https://github.com/youssef336/flutter_unused_code
issue_tracker: https://github.com/youssef336/flutter_unused_code/issues
topics:
  - dead-code
  - static-analysis
  - flutter
  - cli
  - lints

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.5.0
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0

executables:
  unused_code: flutter_unused_code
